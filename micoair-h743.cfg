# Source the ST-Link interface configuration
source [find interface/stlink.cfg]

# Source the base STM32H7x target configuration.
# This will create the target and should find the first flash bank.
source [find target/stm32h7x.cfg]

# Now that the target has been created by the script above,
# we explicitly define the second flash bank. The default script
# often fails to do this automatically. We use the known target name
# for the CPU, 'stm32h7x.cpu0', which was identified from the OpenOCD log output.
flash bank stm32h7x.flash1 stm32h7x 0x08100000 0x100000 0 0 stm32h7x.cpu0
